{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-6 col-lg-4">
  <h1 class="h3 mb-3">Create an account</h1>
  <form method="post" action="/register" class="card card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="form-label" for="name">Full name</label>
    <input class="form-control mb-3" id="name" name="name" required minlength="2" value="{{ (form or {}).get('name', '') }}">
    <label class="form-label" for="email">Email</label>
    <input class="form-control mb-3" id="email" name="email" type="email" required value="{{ (form or {}).get('email', '') }}">
    <label class="form-label" for="password">Password (8+ characters)</label>
    <input class="form-control mb-3" id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <button class="btn btn-primary">Register</button>
  </form>
</div></div>
{% endblock %}
