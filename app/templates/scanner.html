
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventSphere | Gate Scanner</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Correct CSS folder path -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

</head>


<body>

<!-- Navigation -->
<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            EventSphere
        </a>

        <a href="/" class="btn btn-outline-light btn-sm">
            Home
        </a>

    </div>

</nav>


<!-- Scanner Section -->
<main class="container my-5">

    <div class="card shadow p-4 mx-auto scanner-card">

        <h2 class="text-center mb-3">
            Gate Ticket Scanner
        </h2>

        <p class="text-muted text-center">
            Scan attendee QR tickets to verify entry.
        </p>


        <!-- Event ID -->
        <div class="mb-3">

            <label for="eventId" class="form-label">
                Event ID
            </label>

            <input
                type="number"
                id="eventId"
                class="form-control"
                min="1"
                placeholder="Enter Event ID"
                required>

        </div>


        <!-- Camera Scanner -->
        <div class="scanner-container mb-3">

            <div id="reader"></div>

        </div>


        <button
            class="btn btn-primary w-100 mb-2"
            onclick="startScanner()">

            <span>Start Camera Scanner</span>

        </button>


        <button
            class="btn btn-secondary w-100 mb-3"
            onclick="stopScanner()">

            Stop Camera

        </button>


        <hr>


        <!-- Manual Ticket Code -->
        <h5 class="mb-3">
            Manual Ticket Verification
        </h5>

        <div class="mb-3">

            <label for="ticketCode" class="form-label">
                Ticket Code
            </label>

            <input
                type="text"
                id="ticketCode"
                class="form-control"
                placeholder="Enter ticket code">

        </div>


        <button
            class="btn btn-success w-100"
            onclick="scanManualTicket()">

            Verify Ticket

        </button>


        <!-- Result Message -->
        <div
            id="scanMessage"
            class="alert d-none mt-3"
            role="alert">
        </div>

    </div>

</main>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">

    <p class="mb-0">
        EventSphere - Gate Management
    </p>

</footer>


<!-- Correct JavaScript folder path -->
<script src="/static/js/app.js"></script>

</body>

</html>
