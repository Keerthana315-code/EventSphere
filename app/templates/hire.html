{% extends "base.html" %}
{% block title %}Hire a venue{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Hire a venue for a private occasion</h1>
<p class="text-muted">Farewells, receptions, club meetings. You get an instant decision and price. Weekend hires cost +25%, evening starts (18:00+) +10%.</p>
<form method="post" action="/hire" class="card card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row g-3">
    <div class="col-12 col-md-6"><label class="form-label">Venue</label>
      <select class="form-select" name="venue_id" required>
        {% for v in venues %}<option value="{{ v.id }}" {{ 'selected' if (form or {}).get('venue_id')|string == v.id|string }}>{{ v.name }} (up to {{ v.capacity }} guests, {{ v.hourly_rate|money }}/h)</option>{% endfor %}
      </select></div>
    <div class="col-12 col-md-6"><label class="form-label">Number of guests</label>
      <input class="form-control" type="number" min="1" name="guests" required value="{{ (form or {}).get('guests', '') }}"></div>
    <div class="col-12 col-md-6"><label class="form-label">Start</label>
      <input class="form-control" type="datetime-local" name="start" required value="{{ (form or {}).get('start', '') }}"></div>
    <div class="col-12 col-md-6"><label class="form-label">End</label>
      <input class="form-control" type="datetime-local" name="end" required value="{{ (form or {}).get('end', '') }}"></div>
    <div class="col-12"><label class="form-label">Purpose</label>
      <input class="form-control" name="purpose" maxlength="200" placeholder="e.g. Farewell party" value="{{ (form or {}).get('purpose', '') }}"></div>
    <div class="col-12 d-grid d-md-block"><button class="btn btn-primary">Request hire</button></div>
  </div>
</form>
{% endblock %}
