{% extends "base.html" %}
{% block title %}Edit venue{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit {{ venue.name }}</h1>
<form method="post" action="/admin/venues/{{ venue.id }}" class="card card-body">
  {% with v = venue %}{% include "admin/_venue_form.html" %}{% endwith %}
  <div class="mt-3 d-flex gap-2"><button class="btn btn-primary">Save</button><a class="btn btn-outline-secondary" href="/admin/venues">Back</a></div>
</form>
{% endblock %}
