<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="row g-3">
  <div class="col-12 col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required value="{{ v.get('name', '') }}"></div>
  <div class="col-12 col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" required value="{{ v.get('location', '') }}"></div>
  <div class="col-6 col-md-3"><label class="form-label">Capacity</label><input class="form-control" type="number" min="1" name="capacity" required value="{{ v.get('capacity', '') }}"></div>
  <div class="col-6 col-md-3"><label class="form-label">Hourly hire rate</label><input class="form-control" type="number" min="0" step="0.01" name="hourly_rate" required value="{{ v.get('hourly_rate', 0) }}"></div>
  <div class="col-12 col-md-6"><label class="form-label">Image URL</label><input class="form-control" name="image_url" placeholder="https://..." value="{{ v.get('image_url', '') }}"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="2">{{ v.get('description', '') }}</textarea></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="open_for_hire" id="ofh" {{ 'checked' if v.get('open_for_hire') }}><label class="form-check-label" for="ofh">Open for private hire</label></div></div>
</div>
