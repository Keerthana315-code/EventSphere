{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-6 col-lg-4">
  <h1 class="h3 mb-3">Sign in</h1>
  <form method="post" action="/login" class="card card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label class="form-label" for="email">Email</label>
    <input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="username">
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-primary">Sign in</button>
  </form>
  <p class="mt-3 small">New here? <a href="/register">Create an attendee account</a>.</p>
</div></div>
{% endblock %}
