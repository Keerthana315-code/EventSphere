# Render Blueprint: one web service + one free PostgreSQL database.
databases:
  - name: eventsphere-db
    plan: free
    databaseName: eventsphere
    user: eventsphere

services:
  - type: web
    name: eventsphere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_API_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        sync: false   # you type this in the Render dashboard; it is never stored in Git
